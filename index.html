<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#24352d">
  <title>硅之路：飞轮危机局</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app-shell">
    <header class="topbar">
      <a class="brand" href="./" aria-label="硅之路首页">
        <span class="brand-mark">SR</span>
        <span><small>1960—1982</small><strong>硅之路</strong></span>
      </a>
      <div class="run-meta">
        <span id="round-label">灰盒测试</span>
        <button id="records-button" class="quiet-button" type="button">公司档案</button>
      </div>
    </header>

    <section id="hud" class="hud hidden" aria-label="公司状态">
      <div class="status-bar">
        <div id="resources" class="resources"></div>
        <div class="crisis-clock"><small>订单冻结</small><strong id="crisis-countdown">6 回合</strong></div>
      </div>
      <div id="engine-panel" class="engine-panel"></div>
      <div id="ability-slots" class="ability-slots" aria-label="公司能力槽"></div>
    </section>

    <section id="start-screen" class="start-screen">
      <p class="kicker">7 回合灰盒 · 一次危机 · 没有董事会保险</p>
      <h1>把公司造出来，<br>再看它怎么死。</h1>
      <p class="lede">六次经营，组装公司能力，撑过最终危机。</p>
      <div class="promise-grid">
        <div><span>01</span><strong>三选一</strong></div>
        <div><span>02</span><strong>承担代价</strong></div>
        <div><span>03</span><strong>扛住危机</strong></div>
      </div>
      <button id="start-button" class="primary-button" type="button">成立公司</button>
      <button id="continue-button" class="text-button hidden" type="button">继续上次经营</button>
    </section>

    <section id="decision-screen" class="screen hidden" aria-live="polite">
      <div class="decision-layout">
        <article id="event-card" class="event-card" tabindex="0" aria-label="决策卡：向左或向右滑动选择">
          <span id="swipe-left" class="swipe-choice swipe-choice-left"></span>
          <span id="swipe-right" class="swipe-choice swipe-choice-right"></span>
          <p id="card-type" class="kicker"></p>
          <h2 id="card-title"></h2>
          <div id="card-context" class="card-context"></div>
          <details class="card-story">
            <summary>查看背景</summary>
            <p id="card-body" class="card-body"></p>
          </details>
        </article>
        <p class="swipe-instruction">拖动卡牌，或选择一侧</p>
        <div id="choices" class="choices"></div>
      </div>
    </section>

    <aside id="result-screen" class="result-toast hidden" aria-live="polite" aria-atomic="true">
      <button id="next-button" class="result-dismiss" type="button" aria-label="关闭结果">×</button>
      <article>
        <p id="result-kicker" class="kicker"></p>
        <h3 id="result-title"></h3>
        <div id="result-deltas" class="result-deltas"></div>
        <div id="result-engine" class="result-engine"></div>
      </article>
    </aside>

    <section id="replacement-screen" class="screen hidden" aria-live="polite">
      <header class="screen-heading"><div><p class="kicker">六个位置已经坐满</p><h2>董事会要求腾出一把椅子</h2></div></header>
      <p id="replacement-copy" class="brief"></p>
      <div id="replacement-grid" class="replacement-grid"></div>
    </section>

    <section id="ending-screen" class="screen hidden" aria-live="polite"></section>
  </main>

  <dialog id="records-dialog" class="records-dialog">
    <header><div><p class="kicker">内部文件</p><h2>公司档案</h2></div><button id="close-records" class="quiet-button" type="button">关闭</button></header>
    <div id="records-content"></div>
  </dialog>

  <script src="cards.config.js"></script>
  <script src="app.js"></script>
</body>
</html>
